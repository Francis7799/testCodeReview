name: Universal CI Test & CodeHive AI Reporter

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Python (pytest / unittest)
      - name: Detect & Run Python Tests
        if: hashFiles('**/*.py') != ''
        continue-on-error: true
        run: |
          python -m pip install pytest 2>/dev/null || true
          pytest --junitxml=test-results.xml || true

      # 2. Node.js / React / TypeScript (npm test)
      - name: Detect & Run Node.js Tests
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: |
          npm ci || npm install || true
          npm test -- --passWithNoTests || true

      # 3. Java Maven / Gradle
      - name: Detect & Run Java Tests
        if: hashFiles('pom.xml', 'build.gradle') != ''
        continue-on-error: true
        run: |
          if [ -f "pom.xml" ]; then mvn test || true; fi
          if [ -f "build.gradle" ]; then ./gradlew test || true; fi

      # 4. Go (go test)
      - name: Detect & Run Go Tests
        if: hashFiles('**/*.go') != ''
        continue-on-error: true
        run: |
          go test ./... || true

      # 5. PHP (phpunit)
      - name: Detect & Run PHP Tests
        if: hashFiles('composer.json', '**/*.php') != ''
        continue-on-error: true
        run: |
          vendor/bin/phpunit || true

      # 6. Universal Step: Report Final CI Test Status to CodeHive AI
      - name: Send Test Results to CodeHive AI
        if: always()
        run: |
          curl -X POST "https://smee.io/codehive-ai-review" \
            -H "Content-Type: application/json" \
            -d '{
              "action": "ci_test_results",
              "repository": {"full_name": "${{ github.repository }}"},
              "pull_request": {"number": ${{ github.event.number }}},
              "commit_sha": "${{ github.sha }}",
              "status": "${{ job.status }}",
              "test_summary": "Universal Multi-Language CI Test Execution Completed (${{ job.status }})"
            }'
